<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 240" width="100%" height="240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07000d" />
      <stop offset="50%" stop-color="#0d021c" />
      <stop offset="100%" stop-color="#040008" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- S-Rank Crimson Fire Gradient -->
    <linearGradient id="sRankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="40%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#990033" />
    </linearGradient>

    <!-- Gauge Gradients -->
    <linearGradient id="gauge1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff5e62" />
    </linearGradient>

    <linearGradient id="gauge2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#b800ff" />
    </linearGradient>

    <linearGradient id="gauge3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="gauge4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b09b" />
      <stop offset="100%" stop-color="#96c93d" />
    </linearGradient>

    <!-- Kanji Shadow Watermark -->
    <linearGradient id="crestKanjiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#7928ca" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Fira Code', 'Monaco', 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif; }

    @keyframes pulseCrest {
      0%, 100% { filter: drop-shadow(0 0 4px #ff0055); transform: scale(1); }
      50% { filter: drop-shadow(0 0 10px #ff007f); transform: scale(1.03); }
    }

    @keyframes barAnim1 { 0% { width: 0; } 100% { width: 175px; } }
    @keyframes barAnim2 { 0% { width: 0; } 100% { width: 165px; } }
    @keyframes barAnim3 { 0% { width: 0; } 100% { width: 160px; } }
    @keyframes barAnim4 { 0% { width: 0; } 100% { width: 170px; } }

    @keyframes statusGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .crest { animation: pulseCrest 3s ease-in-out infinite; transform-origin: 75px 115px; }
    .b1 { animation: barAnim1 1.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
    .b2 { animation: barAnim2 2.0s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
    .b3 { animation: barAnim3 2.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
    .b4 { animation: barAnim4 2.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
    .status-dot { animation: statusGlow 1.6s ease-in-out infinite; }
  </style>

  <!-- Chassis Plate with Chamfered Tech Corners -->
  <path d="M 20 6 L 430 6 L 444 20 L 444 220 L 430 234 L 20 234 L 6 220 L 6 20 Z" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.8" />
  <path d="M 20 6 L 430 6 L 444 20 L 444 220 L 430 234 L 20 234 L 6 220 L 6 20 Z" fill="url(#cardGrid)" />

  <!-- Background Watermark Kanji (特級 - Special Grade) -->
  <text x="390" y="160" font-size="110" font-weight="900" font-family="'Segoe UI', 'Yu Gothic', sans-serif" fill="url(#crestKanjiGrad)" text-anchor="end" pointer-events="none">特級</text>

  <!-- Top System Header Bar -->
  <g class="mono" font-size="9" font-weight="700" letter-spacing="1.2">
    <text x="18" y="24" fill="#ff0055">HUNTER GUILD LICENSE</text>
    <text x="170" y="24" fill="#ffffff" fill-opacity="0.3">//</text>
    <text x="185" y="24" fill="#00f2fe">CLASS-A VERIFIED</text>
    
    <text x="428" y="24" fill="#a0a0c0" text-anchor="end">NO. 2026-CSE-832</text>
  </g>
  <line x1="16" y1="31" x2="434" y2="31" stroke="#32145a" stroke-width="1" opacity="0.6" />

  <!-- LEFT COLUMN: S-RANK CREST SHIELD -->
  <g transform="translate(18, 45)" class="crest">
    <!-- Hexagonal Shield Badge -->
    <polygon points="55,0 105,28 105,88 55,116 5,88 5,28" fill="#130129" stroke="#ff0055" stroke-width="2" />
    <polygon points="55,6 98,31 98,84 55,110 12,84 12,31" fill="#070010" stroke="#7928ca" stroke-width="1.2" />

    <!-- Big S Symbol -->
    <text x="55" y="74" class="sans" font-size="52" font-weight="900" fill="url(#sRankGrad)" text-anchor="middle" filter="url(#badgeGlow)">S</text>
    
    <!-- Rank Subtext -->
    <rect x="18" y="86" width="74" height="15" rx="3" fill="#ff0055" />
    <text x="55" y="97" class="mono" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SPECIAL GRADE</text>
  </g>

  <!-- Power Rating Under Badge -->
  <g transform="translate(18, 172)" class="mono" font-size="8.5" text-anchor="center">
    <rect x="0" y="0" width="110" height="20" rx="4" fill="#180433" stroke="#7928ca" stroke-width="1" />
    <text x="55" y="14" fill="#00f2fe" font-weight="800" text-anchor="middle" letter-spacing="1">MANA: LIMIT BREAK</text>
  </g>

  <!-- RIGHT COLUMN: HUNTER IDENTITY & COMBAT STAT BARS -->
  <g transform="translate(142, 45)">
    <!-- Identity Header -->
    <text x="0" y="12" class="sans" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      RAJ DUGANE
    </text>
    <text x="0" y="26" class="mono" font-size="9" font-weight="700" fill="#ff758c" letter-spacing="1">
      FULL STACK // WEB ARCHITECT
    </text>

    <!-- Divider -->
    <line x1="0" y1="34" x2="285" y2="34" stroke="#7928ca" stroke-width="0.8" opacity="0.5" />

    <!-- STAT BAR 1: FRONTLINE MASTERY -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" class="mono" font-size="8.5" font-weight="700" fill="#cfcfe6">FRONTLINE [React, Tailwind, JS]</text>
      <text x="285" y="0" class="mono" font-size="8.5" font-weight="800" fill="#ff5e62" text-anchor="end">95%</text>
      <!-- Track -->
      <rect x="0" y="4" width="285" height="7" rx="3.5" fill="#140228" stroke="#35105a" stroke-width="0.8" />
      <rect x="1" y="5" width="268" height="5" rx="2.5" fill="url(#gauge1)" class="b1" />
    </g>

    <!-- STAT BAR 2: ALGORITHMIC KI -->
    <g transform="translate(0, 74)">
      <text x="0" y="0" class="mono" font-size="8.5" font-weight="700" fill="#cfcfe6">ALGORITHMIC KI [C++, Python, DSA]</text>
      <text x="285" y="0" class="mono" font-size="8.5" font-weight="800" fill="#b800ff" text-anchor="end">90%</text>
      <!-- Track -->
      <rect x="0" y="4" width="285" height="7" rx="3.5" fill="#140228" stroke="#35105a" stroke-width="0.8" />
      <rect x="1" y="5" width="254" height="5" rx="2.5" fill="url(#gauge2)" class="b2" />
    </g>

    <!-- STAT BAR 3: DOMAIN SYNTHESIS -->
    <g transform="translate(0, 100)">
      <text x="0" y="0" class="mono" font-size="8.5" font-weight="700" fill="#cfcfe6">DOMAIN VAULT [Supabase, SQL, APIs]</text>
      <text x="285" y="0" class="mono" font-size="8.5" font-weight="800" fill="#00f2fe" text-anchor="end">88%</text>
      <!-- Track -->
      <rect x="0" y="4" width="285" height="7" rx="3.5" fill="#140228" stroke="#35105a" stroke-width="0.8" />
      <rect x="1" y="5" width="248" height="5" rx="2.5" fill="url(#gauge3)" class="b3" />
    </g>

    <!-- STAT BAR 4: PIPELINE FLOW -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" class="mono" font-size="8.5" font-weight="700" fill="#cfcfe6">PIPELINE FLOW [n8n Automation, SIH]</text>
      <text x="285" y="0" class="mono" font-size="8.5" font-weight="800" fill="#96c93d" text-anchor="end">92%</text>
      <!-- Track -->
      <rect x="0" y="4" width="285" height="7" rx="3.5" fill="#140228" stroke="#35105a" stroke-width="0.8" />
      <rect x="1" y="5" width="260" height="5" rx="2.5" fill="url(#gauge4)" class="b4" />
    </g>
  </g>

  <!-- BOTTOM STATUS FOOTER -->
  <line x1="16" y1="205" x2="434" y2="205" stroke="#32145a" stroke-width="1" opacity="0.6" />
  <g transform="translate(18, 222)" class="mono" font-size="8.5" font-weight="700">
    <circle cx="5" cy="-3" r="3.5" fill="#00f2fe" class="status-dot" />
    <text x="15" y="0" fill="#00f2fe">SYSTEM STATUS: READY FOR RECRUITMENT &amp; INTERNSHIPS</text>
    <text x="410" y="0" fill="#ffffff" fill-opacity="0.4" text-anchor="end">MIT ADT CSE '26</text>
  </g>
</svg>
